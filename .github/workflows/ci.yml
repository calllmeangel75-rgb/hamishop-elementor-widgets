name: CI

# Gates:
#   lint           — every PHP file compiles on 7.4 … 8.3 (the range we claim)
#   harness        — every plugin file loads in WordPress order (compile fatals)
#   unit           — pure logic, no WordPress
#   sqlengines     — the wallet DDL on MySQL 8 and MariaDB 11 (services)
#   wp-integration — a real WordPress + WooCommerce install (services), running
#                    the QA scripts that need both: the free-shipping cache
#                    invalidation and the shipping-session scenario
#   checks         — version/text-domain/debug/asset/catalog consistency
#   generated      — .min and .pot are up to date with their sources
#
# The browser probes in tests/*.js still need a live site and a customer
# session; they are run locally against XAMPP, not here.

on:
  push:
    branches: [ main ]
    # Without this line a tag push never starts the workflow at all, so the
    # `package` job below (which is gated on refs/tags/v*) could never run.
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: php -l on every file
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then
              echo "::error file=${file}::${out}"
              echo "$out"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $fail

  harness:
    name: harness (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest stable one: the harness is
        # about declarations (extends/implements/visibility), not runtime.
        php: [ '7.4', '8.2' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Load every plugin file
        run: php tests/harness.php

  unit:
    name: unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Pure logic only (Jalali calendar, amount in words): no WordPress and no
      # database, so it runs on every version the plugin supports.
      - name: Jalali + number_words
        run: php tests/unit/run.php

      # The digital-checkout filter used to call itself through
      # woocommerce_cart_needs_shipping: an unbounded recursion that killed the
      # request once the cart had an item in it. This guard needs no database.
      - name: digital checkout recursion guard
        run: php tests/qa/digital-checkout-sim.php

      - name: display cart refresh guard
        run: php tests/qa/display-cart-refresh.php

      - name: cart variation labels
        run: php tests/qa/cart-variation-labels.php

      - name: completion payment indicator
        run: php tests/qa/completion-paid-indicator.php

  sqlengines:
    name: SQL compatibility (MySQL 8 + MariaDB, strict)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hsw_qa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hsw_qa
        ports:
          - 3307:3306
        # `docker create` rejects a flag it does not know, and a service that
        # fails to start fails the whole job before a single test runs: the
        # previous `--command=--sql-mode=…` line did exactly that
        # ("unknown flag: --command"). MariaDB 11 already defaults to
        # STRICT_TRANS_TABLES, which is the realistic hosting mode this test is
        # meant to prove.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      # Server defaults stay in force on both engines (MySQL 8 is strict with
      # NO_ZERO_DATE; MariaDB 11 defaults to STRICT_TRANS_TABLES). The old
      # `SET SESSION sql_mode` escape hatch is gone — the DDL must hold on a
      # strict server.
      - name: Wallet statements on MySQL 8
        run: |
          HSW_QA_DSN="mysql:host=127.0.0.1;port=3306;dbname=hsw_qa" \
          HSW_QA_USER=root \
          HSW_QA_PASS=root \
          php tests/qa/sql-compat.php
          HSW_QA_DSN="mysql:host=127.0.0.1;port=3306;dbname=hsw_qa" \
          HSW_QA_USER=root \
          HSW_QA_PASS=root \
          php tests/qa/remediation.php

      - name: Wallet statements on MariaDB 11
        run: |
          HSW_QA_DSN="mysql:host=127.0.0.1;port=3307;dbname=hsw_qa" \
          HSW_QA_USER=root \
          HSW_QA_PASS=root \
          php tests/qa/sql-compat.php
          HSW_QA_DSN="mysql:host=127.0.0.1;port=3307;dbname=hsw_qa" \
          HSW_QA_USER=root \
          HSW_QA_PASS=root \
          php tests/qa/remediation.php

  wp-integration:
    name: WordPress + WooCommerce (integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, zip, gd, curl, exif, intl
          coverage: none
          tools: none

      # A real install, because these scripts drive update_option()/delete_option()
      # and read what WooCommerce writes back. Stubs cannot prove that.
      - name: Install WordPress, WooCommerce and the plugin
        run: |
          curl -sS -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          mkdir -p /tmp/wp
          cd /tmp/wp
          php /tmp/wp-cli.phar core download --allow-root
          php /tmp/wp-cli.phar config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          php /tmp/wp-cli.phar core install --url=http://localhost --title=HSW-CI --admin_user=admin --admin_password=admin --admin_email=ci@example.com --skip-email --allow-root
          php /tmp/wp-cli.phar plugin install woocommerce elementor --activate --allow-root
          ln -s "$GITHUB_WORKSPACE" /tmp/wp/wp-content/plugins/hamishop-elementor-widgets
          php /tmp/wp-cli.phar plugin activate hamishop-elementor-widgets --allow-root
          php /tmp/wp-cli.phar plugin list --allow-root

      - name: Cart variation labels (real WordPress terms)
        env:
          HSW_WP_LOAD: /tmp/wp/wp-load.php
          HSW_QA_DISPOSABLE: '1'
          WP_ENVIRONMENT_TYPE: local
        run: php tests/qa/cart-variation-labels-wp.php

      - name: Completion indicator (real WooCommerce order objects)
        env:
          HSW_WP_LOAD: /tmp/wp/wp-load.php
          HSW_QA_DISPOSABLE: '1'
          WP_ENVIRONMENT_TYPE: local
        run: php tests/qa/completion-paid-indicator-wp.php

      - name: Account invoice payment display (disposable WordPress)
        env:
          HSW_WP_LOAD: /tmp/wp/wp-load.php
          HSW_QA_DISPOSABLE: '1'
          WP_ENVIRONMENT_TYPE: local
        run: php tests/qa/account-invoice-cod-wp.php

      - name: Free-shipping cache invalidation
        env:
          HSW_WP_LOAD: /tmp/wp/wp-load.php
        run: php tests/qa/free-shipping-cache.php

      # Builds its own product, zone and rate, places a real order through
      # POST /hsw/v1/checkout/complete, and removes all of it afterwards.
      - name: Shipping session scenario
        env:
          HSW_WP_LOAD: /tmp/wp/wp-load.php
          # The script refuses to run when wp_get_environment_type() says
          # production; this install is disposable and lives for the job.
          HSW_QA_ALLOW: '1'
        run: php tests/qa/shipping-session.php

  checks:
    name: structural checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Version, text domain, debug leftovers, assets, catalog, docs
        run: php tools/ci-checks.php

  generated:
    name: generated files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset minifier
        run: pip install --quiet csscompressor rjsmin

      - name: Rebuild .min assets and the POT
        run: |
          python tools/build-assets.py
          python tools/build-pot.py

      - name: Nothing may change
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- assets languages)" ]; then
            echo "::error title=Generated files are stale::Run 'python tools/build-assets.py' and 'python tools/build-pot.py', then commit the result."
            git status --porcelain -- assets languages
            git --no-pager diff --stat -- assets languages
            exit 1
          fi
          echo "assets and languages are in sync with their sources."

  package:
    # Tagging v* produces the distributable ZIP as a workflow artifact, using the
    # same script as a local release, so the artefact is never hand-assembled.
    # A manual run also packages, which is how the tag path itself gets tested
    # without cutting a release just to see whether it works.
    name: release package
    if: startsWith( github.ref, 'refs/tags/v' ) || github.event_name == 'workflow_dispatch'
    needs: [ lint, harness, checks, generated ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read plugin version
        id: ver
        shell: bash
        run: |
          version=$(grep -m1 '^ \* Version:' hamishop-elementor-widgets.php | sed 's/.*Version:[[:space:]]*//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "packaged version: ${version}"

      - name: Build ZIP
        # build-release.py writes one level above the plugin folder (../<slug>-<ver>.zip),
        # which is outside the workspace runner, so bring it back in for the upload.
        run: |
          python tools/build-release.py
          cp ../hamishop-elementor-widgets-*.zip .

      - uses: actions/upload-artifact@v4
        with:
          # Version, not ref name: a manual run would otherwise produce an artifact
          # called "…-main".
          name: hamishop-elementor-widgets-${{ steps.ver.outputs.version }}
          path: hamishop-elementor-widgets-*.zip
          if-no-files-found: error
          retention-days: 90
